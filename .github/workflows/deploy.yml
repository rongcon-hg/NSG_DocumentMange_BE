name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            if ! command -v libreoffice &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y libreoffice
            fi
            cd /var/www/nsg-be
            git reset --hard
            git pull origin main
            pm2 restart all || pm2 restart nsg-be
            pm2 save
      - name: Deploy to VPS 160.25.166.176 via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: 160.25.166.176
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            TARGET_DIR=""
            if command -v pm2 &> /dev/null; then
              PM2_DIR=$(pm2 jlist 2>/dev/null | grep -o '"pm_cwd":"[^"]*"' | head -n 1 | cut -d'"' -f4)
              if [ -n "$PM2_DIR" ] && [ -d "$PM2_DIR" ]; then
                TARGET_DIR="$PM2_DIR"
              fi
            fi
            if [ -z "$TARGET_DIR" ]; then
              for dir in /var/www/nsg-be /var/www/NSG_DocumentMange_BE /var/www/* /root/* /home/*/*; do
                if [ -d "$dir/.git" ] && [ -f "$dir/server.js" ]; then
                  TARGET_DIR="$dir"
                  break
                fi
              done
            fi
            echo "TARGET_DIR is: $TARGET_DIR"
            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              pwd
              git reset --hard
              git pull origin main
              pm2 restart all || pm2 restart nsg-be
              pm2 save
            else
              echo "Directory not found, searching with find..."
              find / -maxdepth 4 -name "server.js" 2>/dev/null
            fi


