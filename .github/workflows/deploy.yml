name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            if ! command -v libreoffice &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y libreoffice
            fi
            cd /var/www/nsg-be
            git reset --hard
            git pull origin main
            pm2 restart all || pm2 restart nsg-be
            pm2 save
      - name: Deploy to VPS 160.25.166.176 via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: 160.25.166.176
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            if [ -f "$HOME/.bashrc" ]; then source "$HOME/.bashrc"; fi
            if [ -f "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; fi
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            echo "=== VPS 160.25.166.176 INFO ==="
            hostname -I
            whoami
            
            TARGET_DIR=""
            PID=$(pgrep -f "server.js" | head -n 1)
            if [ -z "$PID" ]; then
              PID=$(pgrep -f "node" | head -n 1)
            fi
            if [ -n "$PID" ] && [ -d "/proc/$PID/cwd" ]; then
              TARGET_DIR=$(readlink -f /proc/$PID/cwd)
              echo "Found running process PID $PID at: $TARGET_DIR"
            fi
            
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              if command -v pm2 &> /dev/null; then
                PM2_DIR=$(pm2 jlist 2>/dev/null | grep -o '"pm_cwd":"[^"]*"' | head -n 1 | cut -d'"' -f4)
                if [ -n "$PM2_DIR" ] && [ -d "$PM2_DIR" ]; then
                  TARGET_DIR="$PM2_DIR"
                fi
              fi
            fi
            
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              for dir in /var/www/nsg-be /var/www/NSG_DocumentMange_BE /var/www/qlvb* /var/www/* /root/nsg-be /root/* /home/*/*; do
                if [ -d "$dir/.git" ] && [ -f "$dir/server.js" ]; then
                  TARGET_DIR="$dir"
                  break
                fi
              done
            fi
            
            echo "Final TARGET_DIR: $TARGET_DIR"
            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              pwd
              git reset --hard
              git pull origin main
              
              PM2_CMD=$(which pm2 2>/dev/null || find /root /home /usr -name pm2 2>/dev/null | head -n 1)
              if [ -n "$PM2_CMD" ]; then
                $PM2_CMD restart all || $PM2_CMD restart nsg-be
                $PM2_CMD save
              elif [ -n "$PID" ]; then
                kill -9 $PID
              fi
            else
              echo "Could not find target dir!"
            fi


